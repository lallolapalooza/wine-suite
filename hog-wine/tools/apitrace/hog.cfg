# ---------------------------------------------------------------------------
# volume control (exclusions win over inclusions; see src/apihook.c:cfg_match)
#
# A first un-narrowed run produced 531 791 call lines in 25 s, of which 469 572 (88%) were
# *one* worker thread (tid 1964) spinning on two critical sections
# (0x6ffffea3ab38 / 0x6ffffea0b0c0) from the very first traced instruction, plus its
# per-font/per-glyph GDI and registry-font churn.  With the IAT tracer those are pure volume:
# Enter/LeaveCriticalSection only emit *successful* returns (blocking is invisible - the call
# is logged after it acquires), and the font/registry/paint calls carry no failure signal.
# Dropping them takes the same run to a few thousand diffable lines.
#
# Critical-section *contention* - i.e. the hang - is still captured, from two sources:
#   * Wine's own sync channel: err:sync:RtlpWaitForCriticalSection<section> ... blocked by ... (logs/api/*.relay.log)
#   * the blocking waits below (WaitForSingleObject/Ex, WaitForMultipleObjects, MsgWait...),
#     which do have a return value and are the calls that never come back during the hang.
# The critical-section *lifecycle* calls (Initialize*/DeleteCriticalSection, SRW, condition
# variables, InitOnce) stay included.
~kernel32!EnterCriticalSection
~kernel32!LeaveCriticalSection
~kernel32!TryEnterCriticalSection
# bulk reads of the fixture/font data (24 028 calls in 25 s); file *handles* are still traced
~kernel32!ReadFile
~kernel32!ReadFileEx
# tracer/reloader + per-item bookkeeping churn
~kernel32!GetCurrentThreadId
~kernel32!Module32FirstW
~kernel32!Module32NextW
# per-font registry enumeration (2 140 RegEnumValueW + 4 281 RegQueryValueExW ... in 25 s);
# RegOpenKeyEx*/RegCreateKeyExW are kept so key *access* is still visible
~advapi32!RegQueryValueExA
~advapi32!RegQueryValueExW
~advapi32!RegEnumKeyExW
~advapi32!RegEnumValueA
~advapi32!RegEnumValueW
~advapi32!RegCloseKey
# per-glyph GDI paint/font churn
~gdi32!SelectObject
~gdi32!DeleteObject
~gdi32!CreateFontIndirectW
~gdi32!EnumFontFamiliesExW
~user32!GetDC
~user32!ReleaseDC
~user32!GetSysColor
