# apihook config for the Hog PC 5.2.1.31 start-up comparison (Wine vs Windows).
#
# Grammar: [~]dll!func[@argc[/argwidths][:retwidth]]   -- see tools/apitrace/test.cfg
#   argc       arguments to log (0..16; default 4)
#   argwidths  bytes architecturally defined per argument (1/2/4/8; 4 = 32-bit DWORD,
#              8 = pointer/HANDLE/SIZE_T).  The upper half of a 32-bit argument register is
#              undefined by the Win64 ABI and differs between Windows and Wine, so it is masked.
#   retwidth   4 or 8 bytes of RAX to record.
#
# Scope: the start-up chain launcher-win32-golden.exe -> server-win32-golden (creates the show
# database) -> desktop-win32-golden (paints the console UI).  Hog PC is a Qt5/QML application
# (Qt 5.15.1 + QtWebEngine/Chromium 80) built with MSVC, installed to
# "C:\Program Files (x86)\ETC\HogPC".  The set is centred on:
#   * thread/sync primitives (the hang neighbourhood),
#   * file/registry I/O and, specifically, **file locking** -- the show store is SQLite
#     (Qt5Sql sqldrivers/qsqlite), whose win32 VFS locks the .hbb show file with
#     LockFileEx -> kernelbase -> NtLockFile,
#   * ws2_32 + iphlpapi network discovery (the console link and adapter enumeration),
#   * netprofm / Network List Manager (Qt5Network's QNetworkStatusMonitor),
#   * setupapi / hid / cfgmgr32 / winusb device enumeration (the console "gadget" USB device and
#     the Sentinel HASP dongle),
#   * advapi32 services (HASP/console services),
#   * dwmapi / opengl32 / gdi32 / user32 (the Qt QPA plugin), and wtsapi32 session queries.
#
# Hog's known fixmes (from logs/runs/hog1): file:NtLockFile (x5), netprofm:init_networks,
# setupapi:DiInstallDriverA, wtsapi:WTSQuerySessionInformationW -- all four have patterns below.
#
# NOTE on "Qt/platform entry points": the tracer matches exact symbol names and add_pattern()
# splits the pattern at the FIRST '@' (tools/apitrace/src/apihook.c), so C++-mangled Qt imports
# such as ?acquire@QSystemSemaphore@@QEAA_NH@Z cannot be expressed in this grammar.  Qt's
# platform surface is covered through the Win32 APIs it calls instead: Qt5Core's
# QSystemSemaphore uses CreateSemaphoreW/OpenSemaphoreA/ReleaseSemaphore, QSharedMemory uses
# CreateFileMappingW/OpenFileMappingW/MapViewOfFile, Qt5Network uses ws2_32/iphlpapi/netprofm,
# Qt5Sql's sqlite plugin uses LockFileEx/UnlockFileEx/NtLockFile, and the QPA plugin
# platforms/qwindows.dll uses user32/gdi32/dwmapi/wtsapi32.  Patterns that no loaded module
# imports are reported as "# unresolved:" in the log header (they cost no call lines).

