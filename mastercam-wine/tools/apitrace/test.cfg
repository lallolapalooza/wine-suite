# apihook config for the self-test program (tools/apitrace).
#
# Syntax:
#   [~]dll!func[@argc[/argwidths][:retwidth]]
#     dll may be written with or without the .dll suffix; "*" matches everything
#     '~' = exclusion (wins over inclusions)
#     argc       number of arguments to log (default 4, max 16)   -> @0 for void
#     argwidths  one digit per argument: bytes that are architecturally defined
#                (1/2/4/8, default 8 = whole register). A 32-bit DWORD parameter
#                only has a defined low half, so its upper half is masked away.
#     retwidth   bytes of the return value to print (4 or 8, default 8)
kernel32!CreateFileW@7/8448448:8
kernel32!WriteFile@5/88488:4
kernel32!ReadFile@5/88488:4
kernel32!CloseHandle@1/8:4
kernel32!GetModuleHandleW@1/8:8
kernel32!MulDiv@3/444:4
kernel32!lstrlenA@1/8:4
kernel32!GetCurrentProcessId@0:4
kernel32!GetCurrentThreadId@0:4
# included, but the exclusion below wins -> DeleteFileW must never be logged
kernel32!DeleteFileW@1/8:4
~kernel32!DeleteFileW
# never imported by anybody -> must be listed as unresolved in the header
ntdll!ThisDoesNotExist
