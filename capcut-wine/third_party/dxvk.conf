# DXVK configuration for CapCut PC under Wine.
# Placed next to CapCut.exe (DXVK reads dxvk.conf from the application directory).
#
# Purpose: control what adapter CapCut's environment detection sees, the way Proton lets a
# game see a chosen GPU, instead of letting Wine's wined3d card table invent an ancient
# "Intel(R) HD Graphics 4000" (dlls/wined3d/directx.c card selector) that no Windows machine
# in this setup reports.
#
# The Windows reference VM reports:  "Microsoft Basic Display Adapter", vendor 1b36, device 0100
#                                    hw_render=0, qt6_render_engine=d3d11, angle_device=auto
#
# Two modes:
#   A) match the Windows reference exactly  -> the app should take the same software path it takes
#      on the Windows guest (which paints fine)
#   B) report the real GPU (DXVK's default)  -> leave these keys commented out
#
# Both are kept here so they can be toggled; only the [dxgi] keys are used.

[dxgi]
# --- mode A: match the Windows reference guest (QXL / Microsoft Basic Display Adapter) ---
customVendorId = 0x1b36
customDeviceId = 0x0100
customDeviceDesc = Microsoft Basic Display Adapter

# --- mode B: report the real adapter as DXVK sees it ---
#customVendorId =
#customDeviceId =
#customDeviceDesc =

# Keep the composition swapchain path enabled: CapCut's Qt RHI drives DirectComposition.
enableDummyCompositionSwapchain = False
